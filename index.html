<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f7">
  <meta name="description" content="在浏览器本地提取图片主色，保存并导出 CSS、JSON、GPL、ASE 色板。">
  <title>图片颜色提取 · 本地色板工具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23262627'/%3E%3Ccircle cx='22' cy='24' r='7' fill='%23a9c29a'/%3E%3Ccircle cx='38' cy='19' r='7' fill='%23598bd6'/%3E%3Ccircle cx='45' cy='36' r='7' fill='%23d8d4c4'/%3E%3Ccircle cx='27' cy='43' r='7' fill='%236e873f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-palette" viewBox="0 0 24 24">
      <path d="M12 2.7C6.8 2.7 2.6 6.9 2.6 12.1s4.2 9.4 9.4 9.4c1.1 0 2-.9 2-2 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.8.7-1.5 1.5-1.5h1.7c3 0 5.4-2.4 5.4-5.4 0-4.5-4.3-7.6-9.6-7.6Z"/>
      <circle cx="7.5" cy="11.2" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="9.9" cy="7.3" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="14.2" cy="7.2" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="16.8" cy="10.7" r=".95" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-swatchbook" viewBox="0 0 24 24">
      <rect x="3.25" y="6.75" width="13.5" height="13.5" rx="2.75"/>
      <path d="M6.75 6.75V5.5A2.5 2.5 0 0 1 9.25 3H17a2.5 2.5 0 0 1 2.5 2.5V14a2.5 2.5 0 0 1-2.5 2.5h-1.25"/>
      <circle cx="7" cy="15.75" r="1.1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M12 15.5V4.25"/>
      <path d="m7.5 8.75 4.5-4.5 4.5 4.5"/>
      <path d="M4.75 14.5v3A2.5 2.5 0 0 0 7.25 20h9.5a2.5 2.5 0 0 0 2.5-2.5v-3"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3.25" y="4.25" width="17.5" height="15.5" rx="3"/>
      <circle cx="8.4" cy="9.3" r="1.4"/>
      <path d="m3.7 17.2 4.35-4.35a2.1 2.1 0 0 1 2.97 0l2.5 2.5"/>
      <path d="m12.2 14.1 1.7-1.7a2.1 2.1 0 0 1 2.97 0l3.43 3.43"/>
    </symbol>
    <symbol id="i-image-plus" viewBox="0 0 24 24">
      <path d="M20.5 13.3v3.4A3.3 3.3 0 0 1 17.2 20H7.3A3.3 3.3 0 0 1 4 16.7V7.3A3.3 3.3 0 0 1 7.3 4H12"/>
      <circle cx="9" cy="8.8" r="1.25"/>
      <path d="m4.2 16.8 3.8-3.8a2.1 2.1 0 0 1 3 0l3.9 3.9"/>
      <path d="M18.5 3.5v6M15.5 6.5h6"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24">
      <path d="M2.75 12S6.25 5.75 12 5.75 21.25 12 21.25 12 17.75 18.25 12 18.25 2.75 12 2.75 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3.5v10.75"/>
      <path d="m7.6 10 4.4 4.4 4.4-4.4"/>
      <path d="M4.5 20.25h15"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m4.5 12.4 4.8 4.8 10.2-10.4"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="4.75" y="10" width="14.5" height="10.25" rx="2.5"/>
      <path d="M8.25 10V7.5a3.75 3.75 0 0 1 7.5 0V10"/>
    </symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24">
      <path d="M12 2.9c3.5 4.2 6.2 7.5 6.2 10.6a6.2 6.2 0 1 1-12.4 0C5.8 10.4 8.5 7.1 12 2.9Z"/>
      <path d="M9.15 14.25a2.8 2.8 0 0 0 2.25 2.3"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.25v13.5M5.25 12h13.5"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15"/>
      <path d="M9.5 7V4.75h5V7"/>
      <path d="m6.3 7 .78 12.05a2 2 0 0 0 2 1.9h5.84a2 2 0 0 0 2-1.9L17.7 7"/>
      <path d="M10 11v5.75M14 11v5.75"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M10.2 4.5 2.9 17.1A2 2 0 0 0 4.6 20h14.8a2 2 0 0 0 1.7-2.9L13.8 4.5a2 2 0 0 0-3.6 0Z"/>
      <path d="M12 9v4.2"/>
      <circle cx="12" cy="16.8" r=".7" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb ambient-orb--blue"></span>
    <span class="ambient-orb ambient-orb--peach"></span>
    <span class="ambient-orb ambient-orb--mint"></span>
    <span class="ambient-grain"></span>
  </div>

  <div class="app" id="app">
    <header class="window-bar">
      <div class="window-title">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon"><use href="#i-palette"/></svg>
        </span>
        <div class="window-title-copy">
          <h1>图片颜色提取</h1>
          <p><span class="status-dot"></span>所有图片仅在本地处理</p>
        </div>
      </div>
      <div class="window-actions">
        <button class="library-button" id="libraryButton" type="button" aria-label="打开我的色板" aria-haspopup="dialog" title="我的色板">
          <svg class="icon"><use href="#i-swatchbook"/></svg>
          <span class="library-label">色板库</span>
          <span class="nav-badge" id="libraryBadge" hidden>0</span>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="preview" id="preview" aria-label="图片预览">
        <canvas id="previewCanvas" aria-label="图片的像素调色预览"></canvas>

        <div class="empty-state" id="emptyState">
          <span class="empty-icon" aria-hidden="true">
            <svg class="icon"><use href="#i-image"/></svg>
            <i><svg class="icon"><use href="#i-plus"/></svg></i>
          </span>
          <strong>放一张图片进来</strong>
          <span class="empty-note">拖拽、粘贴，或从设备选择</span>
          <button class="upload-pill" id="pickButton" type="button">
            <svg class="icon"><use href="#i-upload"/></svg>
            选择图片
          </button>
        </div>

        <div class="canvas-actions" id="previewActions" hidden>
          <button class="canvas-action" id="viewOriginalButton" type="button">
            <svg class="icon"><use href="#i-eye"/></svg>
            查看原图
          </button>
          <button class="canvas-action" id="changeButton" type="button">
            <svg class="icon"><use href="#i-image-plus"/></svg>
            更换图片
          </button>
        </div>

        <div class="preview-loading" id="previewLoading" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="loadingLabel">正在分析颜色</span>
        </div>

        <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
          <svg class="icon"><use href="#i-upload"/></svg>
          <strong>松开图片即可导入</strong>
        </div>

        <input type="file" id="fileInput" accept="image/*" hidden>
      </section>

      <aside class="inspector" aria-label="调色与导出">
        <section class="accuracy" aria-labelledby="precisionLabel">
          <div class="row-head">
            <label id="precisionLabel" for="precision">提取精度</label>
            <output id="precisionValue" for="precision">75</output>
          </div>
          <input class="range" id="precision" type="range" min="10" max="100" step="1" value="75" aria-describedby="precisionHelp">
          <p class="sr-only" id="precisionHelp">数值越高，提取出的颜色数量越多。</p>
        </section>

        <section class="palette" aria-labelledby="paletteTitle">
          <div class="palette-head">
            <div class="palette-heading">
              <h2 id="paletteTitle">主要颜色</h2>
              <p id="paletteMeta" aria-live="polite">正在准备色板…</p>
            </div>
          </div>
          <div class="palette-grid" id="paletteGrid" aria-busy="true"></div>
        </section>

        <div class="action-area">
          <button class="export-button" id="exportButton" type="button" disabled>
            <svg class="icon"><use href="#i-download"/></svg>
            导出
          </button>
          <button class="save-button" id="saveButton" type="button" disabled>保存到色板</button>
        </div>
      </aside>
    </main>
  </div>

  <dialog class="sheet-dialog" id="libraryDialog" aria-labelledby="libraryTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dialog-head">
      <div>
        <span class="dialog-eyebrow">保存在此浏览器</span>
        <h2 id="libraryTitle">我的色板</h2>
      </div>
      <button class="icon-button subtle" type="button" data-close-dialog aria-label="关闭我的色板">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="library-list" id="libraryList"></div>
    <div class="dialog-foot" id="libraryFoot" hidden></div>
  </dialog>

  <dialog class="sheet-dialog export-dialog" id="exportDialog" aria-labelledby="exportTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dialog-head">
      <div>
        <span class="dialog-eyebrow">选择常用格式</span>
        <h2 id="exportTitle">导出色板</h2>
        <p class="dialog-subtitle" id="exportSubtitle"></p>
      </div>
      <button class="icon-button subtle" type="button" data-close-dialog aria-label="关闭导出窗口">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="export-body">
      <div class="export-strip" id="exportStrip" aria-hidden="true"></div>
      <div class="format-list" id="formatList">
        <button class="format-option" type="button" data-format="css">
          <span class="file-badge">CSS</span>
          <span class="format-copy"><strong>CSS 变量</strong><small>可直接贴进样式表</small></span>
          <span class="format-ext">.css<svg class="icon"><use href="#i-download"/></svg></span>
        </button>
        <button class="format-option" type="button" data-format="json">
          <span class="file-badge">JSON</span>
          <span class="format-copy"><strong>JSON 数据</strong><small>含 HEX / RGB / HSL 与占比</small></span>
          <span class="format-ext">.json<svg class="icon"><use href="#i-download"/></svg></span>
        </button>
        <button class="format-option" type="button" data-format="gpl">
          <span class="file-badge">GPL</span>
          <span class="format-copy"><strong>GIMP 色板</strong><small>兼容 GIMP、Krita、Inkscape</small></span>
          <span class="format-ext">.gpl<svg class="icon"><use href="#i-download"/></svg></span>
        </button>
        <button class="format-option" type="button" data-format="ase">
          <span class="file-badge">ASE</span>
          <span class="format-copy"><strong>Adobe 色板</strong><small>适用于 Photoshop、Illustrator</small></span>
          <span class="format-ext">.ase<svg class="icon"><use href="#i-download"/></svg></span>
        </button>
      </div>
      <p class="dialog-note">
        <svg class="icon"><use href="#i-lock"/></svg>
        文件在你的设备上即时生成，不会上传
      </p>
    </div>
  </dialog>

  <dialog class="lightbox" id="imageDialog" aria-labelledby="lightboxTitle">
    <div class="lightbox-head">
      <h2 class="lightbox-title" id="lightboxTitle">原图预览</h2>
      <button class="lightbox-close icon-button subtle" type="button" data-close-dialog aria-label="关闭原图">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="lightbox-body">
      <img id="lightboxImage" alt="当前图片原图">
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-icon" id="toastIcon">
      <svg class="icon"><use href="#i-check"/></svg>
    </span>
    <span class="toast-message" id="toastMessage"></span>
    <button class="toast-action" id="toastAction" type="button" hidden></button>
  </div>

  <script src="assets/sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
